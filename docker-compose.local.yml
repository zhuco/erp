version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: erp-postgres
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - "5432:5432"
    volumes:
      - erp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7
    container_name: erp-redis
    ports:
      - "6379:6379"
    volumes:
      - erp-redis-data:/data
  nats:
    image: nats:2.10
    container_name: erp-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

volumes:
  erp-postgres-data:
  erp-redis-data:
