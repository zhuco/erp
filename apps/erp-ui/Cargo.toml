[package]
name = "erp-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "erp-grid-lab"
path = "src/main.rs"

[dependencies]
erp-grid-core = { path = "../../crates/erp-grid-core" }
erp-ui-egui = { path = "../../crates/erp-ui-egui" }
eframe = { version = "=0.36.1", default-features = false, features = ["default_fonts", "wgpu", "persistence", "web_screen_reader"] }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["js"] }
web-time = "=1.1.0"
futures = { workspace = true }
url = { workspace = true }
zip = { version = "=0.6.6", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sqlx = { version = "=0.7.4", default-features = false, features = ["runtime-tokio", "sqlite"] }
reqwest = { workspace = true, features = ["stream"] }
tokio = { workspace = true }
eframe = { version = "=0.36.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlElement", "Node", "Request", "RequestInit", "RequestRedirect", "Response", "Headers", "AbortController", "AbortSignal", "ReadableStream", "ReadableStreamDefaultReader", "BeforeUnloadEvent", "Event"] }

[target.'cfg(target_arch = "wasm32")'.dependencies.js-sys]
version = "0.3"

[dev-dependencies]
calamine = { workspace = true }
tempfile = "=3.24.0"
