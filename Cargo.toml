[workspace]
resolver = "3"
members = [
  "crates/erp-grid-core",
  "crates/erp-ui-egui",
  "apps/erp-ui",
  "crates/erp-common",
  "crates/erp-types",
  "crates/erp-domain",
  "crates/erp-adapter",
  "crates/erp-repo",
  "crates/erp-outbox",
  "crates/adapter-taobao",
  "crates/adapter-jd",
  "crates/adapter-pdd",
  "crates/adapter-douyin",
  "crates/erp-api",
  "crates/erp-channel",
  "crates/erp-worker",
  "crates/erp-dispatcher",
  "crates/erp-print-agent",
  "crates/erp-analytics",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
license = "Proprietary"

[workspace.dependencies]
anyhow = "1"
async-nats = "0.37"
axum = { version = "0.7", features = ["macros", "multipart"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
config = "0.14"
csv = "1"
calamine = "0.24"
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
md5 = "0.7"
futures = "0.3"
http = "1"
http-body-util = "0.1"
jsonwebtoken = "9"
once_cell = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros"] }
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
argon2 = "0.5"
base64 = "0.22"
