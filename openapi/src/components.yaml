  InventoryMovementRequest:
    type: object
    additionalProperties: false
    required: [warehouse_id, sku_id, quantity]
    properties:
      warehouse_id: { type: string }
      sku_id: { type: string }
      batch_id: { type: string, format: uuid, nullable: true, description: "Actual enterprise/SKU batch UUID for both legacy and original commands. Nil or UUID combined with location/batch_code/quality is rejected. Incoming batch-managed stock requires this identity; unselected outgoing stock uses complete eligible FEFO. Unknown exact history or inconsistent batch/SKU totals requires reconciliation." }
      quantity: { type: integer, format: int64, description: "Legacy whole base units. 1 remains one unit." }
      reason: { type: string, nullable: true }
      reference_id: { type: string, nullable: true }
      request_id:
        type: string
        nullable: true
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
        description: "Original identity, normalized by trimming. Stock, logs and immutable results commit together, including structured inbound/outbound location projections. Same ID with changed actor, kind, physical key, quantity, reason, reference, location, batch or quality conflicts. Header and body identities must match. Omitting the identity retains a legacy operation without command recovery; structured movements require identity and all three dimensions."
      location_id: { type: string, format: uuid, nullable: true, description: "Structured inbound/outbound; requires an original identity and a valid enabled location in this warehouse." }
      batch_code: { type: string, maxLength: 128, nullable: true, description: "Structured movement; nonempty trimmed UTF-8 text, at most 128 bytes, no control characters. Its projection cites the canonical inventory effect." }
      quality_status: { type: string, enum: [GOOD, PENDING, FAILED, HOLD], nullable: true, description: "Inbound non-GOOD states increase physical and frozen equally. Outbound accepts only GOOD and subtracts this location's reserved, frozen and unavailable quantities before admission; quality release is a separate future command." }
  InventoryAdjustmentRequest:
    type: object
    additionalProperties: false
    required: [warehouse_id, sku_id, quantity_delta]
    properties:
      warehouse_id: { type: string }
      sku_id: { type: string }
      batch_id: { type: string, format: uuid, nullable: true, description: "Actual enterprise/SKU batch UUID, included in original command identity and immutable effects. Negative adjustments use only free, unexpired exact stock; no guessed activation of historical quantities." }
      quantity_delta: { type: integer, format: int64 }
      reason: { type: string, nullable: true }
      reference_id: { type: string, nullable: true }
      request_id:
        type: string
        nullable: true
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
        description: "Original command identity for a nonzero whole-unit adjustment. Idempotency-Key must match when both are sent."
  InventoryReservationRequest:
    type: object
    additionalProperties: false
    required: [warehouse_id, sku_id, quantity]
    properties:
      warehouse_id: { type: string }
      sku_id: { type: string }
      quantity: { type: integer, format: int64, minimum: 1, description: "Positive whole base units. Exact stored quantities and results use six-digit decimal text." }
      order_id: { type: string, nullable: true }
      order_item_id: { type: string, nullable: true }
      reference_id: { type: string, nullable: true, maxLength: 128, description: "Source alias; at least one alias is required. If both aliases are present their trimmed values must agree. One source binds a single warehouse/SKU/location/batch/quality and original quantity." }
      request_id: { type: string, nullable: true, minLength: 1, maxLength: 128, pattern: '^[!-~]+$', description: "Original reserve/release identity; agrees with Idempotency-Key. Structured commands require this identity and all three location dimensions." }
      location_id: { type: string, format: uuid, nullable: true }
      batch_code: { type: string, maxLength: 128, nullable: true }
      quality_status: { type: string, enum: [GOOD], nullable: true }
  InventoryReleaseRequest:
    type: object
    additionalProperties: false
    required: [warehouse_id, sku_id, quantity]
    properties:
      warehouse_id: { type: string }
      sku_id: { type: string }
      quantity: { type: integer, format: int64, minimum: 1, description: "Positive whole base units. Exact stored quantities and results use six-digit decimal text." }
      order_id: { type: string, format: uuid, nullable: true, description: "Original opaque source context; must match the reserve command. This endpoint does not transition or confirm a sales order." }
      order_item_id: { type: string, nullable: true }
      reference_id: { type: string, nullable: true, maxLength: 128, description: "Source alias; at least one alias is required. If both aliases are present their trimmed values must agree. One source binds a single warehouse/SKU/location/batch/quality and original quantity." }
      request_id: { type: string, nullable: true, minLength: 1, maxLength: 128, pattern: '^[!-~]+$', description: "Original reserve/release identity; agrees with Idempotency-Key. Structured commands require this identity and all three location dimensions." }
      location_id: { type: string, format: uuid, nullable: true }
      batch_code: { type: string, maxLength: 128, nullable: true }
      quality_status: { type: string, enum: [GOOD], nullable: true }
  InventoryMutationResponse:
    type: object
    required: [record]
    properties:
      record:
        $ref: "#/components/schemas/InventoryRecord"
  InventoryCommandResponse:
    type: object
    required: [request_id, status, replay, effect_id, payload_hash, operation_log_id, audit_id, record]
    properties:
      request_id: { type: string }
      status: { type: string, enum: [SUCCEEDED] }
      replay: { type: boolean }
      effect_id: { type: string, format: uuid, description: "Original inventory ledger identity." }
      payload_hash: { type: string, pattern: '^[0-9a-f]{64}$' }
      operation_log_id: { type: string, format: uuid }
      audit_id: { type: string, format: uuid }
      record:
        allOf:
          - $ref: "#/components/schemas/InventoryRecord"
        description: "Immutable result at the original commit, including its original updated_at. It is not current stock."
      location: { $ref: "#/components/schemas/InventoryInboundLocation" }
      location_record: { $ref: "#/components/schemas/InventoryLocationEffect" }
      ledger_id: { type: string, format: uuid, description: "Present for structured inbound/outbound; original shared projection ID." }
      qty_micros: { type: integer, format: int64, deprecated: true, description: "Signed compatibility delta: inbound positive, outbound negative. Use decimal text for exact quantities." }
      bucket: { type: string, enum: [ON_HAND, RESERVED] }
      reservation_record: { $ref: "#/components/schemas/InventoryLocationReservationEffect" }
      source_line: { type: string }
      batch_id: { type: string, format: uuid, nullable: true, description: "Original requested UUID; null when outgoing FEFO selected multiple actual batches." }
      batch_effects:
        type: array
        maxItems: 1000
        description: "Present for actual UUID batch effects. Each child binds the original owned SKU ledger and metadata at commit; GET/replay never consults today's batch balance or name."
        items: { $ref: "#/components/schemas/InventoryBatchEffect" }
  InventoryBatchEffect:
    type: object
    additionalProperties: false
    required: [batch_movement_id, inventory_ledger_id, batch_id, before_on_hand_micros, after_on_hand_micros, before_reserved_micros, after_reserved_micros, delta_on_hand_micros, delta_reserved_micros, decision_at, batch_metadata_snapshot, created_at]
    properties:
      batch_movement_id: { type: string, format: uuid }
      inventory_ledger_id: { type: string, format: uuid }
      batch_id: { type: string, format: uuid }
      before_on_hand_micros: { type: string, pattern: '^(0|[1-9][0-9]*)$', description: "Exact bigint micro-units serialized as decimal text, including beyond JavaScript safe integers." }
      after_on_hand_micros: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
      before_reserved_micros: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
      after_reserved_micros: { type: string, pattern: '^(0|[1-9][0-9]*)$' }
      delta_on_hand_micros: { type: string, pattern: '^(0|-?[1-9][0-9]*)$' }
      delta_reserved_micros: { type: string, pattern: '^(0|-?[1-9][0-9]*)$' }
      decision_at: { type: string, format: date-time, description: "Actual PostgreSQL clock time after owned balance and metadata locks." }
      created_at: { type: string, format: date-time }
      batch_metadata_snapshot:
        type: object
        description: "Original owned sku_batches row, immutable even after later metadata changes."
        required: [tenant_id, sku_id, batch_id, batch_no]
        properties:
          tenant_id: { type: string, format: uuid }
          sku_id: { type: string, format: uuid }
          batch_id: { type: string, format: uuid }
          batch_no: { type: string }
          expire_at: { type: string, format: date-time, nullable: true }
          created_at: { type: string, format: date-time }
          updated_at: { type: string, format: date-time }
  InventoryCommandErrorResponse:
    type: object
    required: [code]
    properties:
      code:
        type: string
        enum: [inventory_command_identity_conflict, inventory_command_reconciliation_required, inventory_location_insufficient_available, inventory_location_quality_not_issuable, inventory_reservation_source_conflict, inventory_reservation_insufficient_remaining, insufficient_available, reservation_not_active, reservation_mismatch, reservation_source_reconciliation_required]
      available_micros: { type: string, pattern: '^[0-9]+$', description: "Exact free location quantity; present for inventory_location_insufficient_available." }
      requested_micros: { type: string, pattern: '^[0-9]+$', description: "Exact positive requested quantity; present for inventory_location_insufficient_available." }
      remaining_micros: { type: string, pattern: '^[0-9]+$', description: "Exact original source remainder at rejection; present for inventory_reservation_insufficient_remaining." }
  InventoryLocationReservationEffect:
    type: object
    additionalProperties: false
    required: [reservation_id, ledger_id, source_line, original_quantity, remaining_quantity, released_quantity, location_reserved, created_at]
    properties:
      reservation_id: { type: string, format: uuid }
      ledger_id: { type: string, format: uuid }
      source_line: { type: string }
      original_quantity: { type: string, description: "Immutable positive source quantity in exact base units." }
      remaining_quantity: { type: string, description: "Source remainder at this command's original commit, not today's remainder." }
      released_quantity: { type: string, description: "Cumulative release at the original commit." }
      location_reserved: { type: string, description: "Full location/batch/quality reservation total at the original commit." }
      created_at: { type: string, format: date-time }
  InventoryLocationReservationResponse:
    allOf:
      - $ref: "#/components/schemas/InventoryCommandResponse"
      - type: object
        required: [location, reservation_record, ledger_id, source_line, qty_micros, bucket]
        properties:
          bucket: { type: string, enum: [RESERVED] }
          reservation_record: { $ref: "#/components/schemas/InventoryLocationReservationEffect" }
    description: "Immutable original source result. Reserve increases only reserved; partial release decreases only this source. Both stock projections, source/event, required logs, Outbox and receipt commit together. Disabled locations reject new reserve but allow release of a matching existing source. Sales shipment and production consumption are separate integration work."
