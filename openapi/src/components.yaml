securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT
schemas:
  SkuGridQuery:
    type: object
    additionalProperties: false
    required: [schema, offset, limit]
    properties:
      schema: { type: integer, enum: [1] }
      offset: { type: integer, format: int64, minimum: 0 }
      limit: { type: integer, minimum: 1, maximum: 500 }
      search: { type: string, nullable: true, description: Literal case-insensitive substring in code/name/barcode/tags; maximum 4096 UTF-8 bytes without NUL }
      filters:
        type: object
        maxProperties: 9
        description: Columns 0 code, 1 barcode, 2 name, 3 kind, 4 cost in cents, 5 active, 6 status, 7 created UTC, 8 updated UTC. Text/Enum for 0-3 and 6; Money for 4; Enum true/false for 5; DateTime for 7-8. Conditions combine with AND.
        additionalProperties: { $ref: '#/components/schemas/SkuGridFilter' }
      sorts:
        type: array
        maxItems: 8
        description: Unique column priorities followed by stable sku_id descending tie breaker. Empty order defaults to created_at descending; NULL/empty last.
        items:
          type: object
          required: [column, descending]
          properties:
            column: { type: integer, minimum: 0, maximum: 8 }
            descending: { type: boolean }
      expression:
        allOf:
          - $ref: '#/components/schemas/SkuGridExpression'
        nullable: true
        description: Nested AND/OR, maximum 64 nodes and 8 levels; combined with quick filters and global search by AND.
  SkuGridFilter:
    oneOf:
      - $ref: '#/components/schemas/ProductGridFilter'
      - type: object
        required: [Money]
        additionalProperties: false
        properties:
          Money:
            type: object
            properties:
              min: { type: integer, format: int64, nullable: true, description: Inclusive cost in cents }
              max: { type: integer, format: int64, nullable: true, description: Inclusive cost in cents }
  SkuGridExpression:
    oneOf:
      - type: object
        required: [Condition]
        additionalProperties: false
        properties:
          Condition:
            type: object
            additionalProperties: false
            required: [column, filter]
            properties:
              column: { type: integer, minimum: 0, maximum: 8 }
              filter: { $ref: '#/components/schemas/SkuGridFilter' }
      - type: object
        required: [And]
        additionalProperties: false
        properties:
          And:
            type: array
            minItems: 1
            maxItems: 63
            items: { $ref: '#/components/schemas/SkuGridExpression' }
      - type: object
        required: [Or]
        additionalProperties: false
        properties:
          Or:
            type: array
            minItems: 1
            maxItems: 63
            items: { $ref: '#/components/schemas/SkuGridExpression' }
  SkuGridPage:
    type: object
    required: [data, total]
    properties:
      total: { type: integer, format: int64, minimum: 0 }
      data:
        type: array
        maxItems: 500
        items: { $ref: '#/components/schemas/SkuGridRow' }
  SkuGridRow:
    type: object
    required: [sku_id, tenant_id, product_id, sku_code, sku_kind, is_active, status, created_at, updated_at]
    properties:
      sku_id: { type: string, format: uuid }
      tenant_id: { type: string, format: uuid }
      product_id: { type: string, format: uuid }
      sku_code: { type: string }
      barcode: { type: string, nullable: true }
      name: { type: string, nullable: true }
      sku_kind: { type: string }
      cost_cent: { type: integer, format: int64, nullable: true }
      is_active: { type: boolean }
      status: { type: string }
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
  SkuGridRangesRequest:
    type: object
    additionalProperties: false
    required: [query, ranges]
    properties:
      query: { $ref: '#/components/schemas/SkuGridQuery' }
      ranges:
        type: array
        minItems: 1
        maxItems: 2
        description: Overlap is allowed; combined limits must not exceed 2000 rows.
        items:
          type: object
          additionalProperties: false
          required: [offset, limit]
          properties:
            offset: { type: integer, format: int64, minimum: 0, maximum: 9223372036854775806 }
            limit: { type: integer, minimum: 1, maximum: 1000 }
  SkuGridRangesPage:
    type: object
    required: [total, pages]
    properties:
      total: { type: integer, format: int64, minimum: 0 }
      pages:
        type: array
        minItems: 1
        maxItems: 2
        items:
          type: object
          required: [offset, data]
          properties:
            offset: { type: integer, format: int64, minimum: 0 }
            data:
              type: array
              maxItems: 1000
              items: { $ref: '#/components/schemas/SkuGridRow' }
  ProductActionCommand:
    type: object
    additionalProperties: false
    required: [operation_id, action, source]
    properties:
      operation_id: { type: string, format: uuid, description: Non-nil logical operation identity retained across retries }
      action: { type: string, enum: [products.copy, products.update] }
      source: { type: string, format: uuid }
      expected_version: { type: string, format: date-time, nullable: true, description: Exact observed updated_at; mandatory for update, optional snapshot guard for copy }
      values:
        type: object
        maxProperties: 4
        description: Copy requires empty values. Update permits IDs 0 code, 1 name, 2 brand, 3 category; maximum 4096 UTF-8 bytes per value, no NUL. Values are trimmed; empty optional fields become NULL, name cannot be empty.
        additionalProperties: { type: string }
  ProductActionReceipt:
    type: object
    required: [operation_id, source, command_fingerprint, outcome]
    properties:
      operation_id: { type: string, format: uuid }
      source: { type: string, format: uuid }
      command_fingerprint:
        type: string
        pattern: '^sha256-v1:[a-f0-9]{64}$'
        description: Versioned SHA-256 fingerprint of the immutable typed ActionCommand. Clients must match it as well as operation_id and source before accepting a receipt; a reused identity may belong to different field values or a different expected version.
      outcome:
        oneOf:
          - type: object
            required: [Applied]
            properties:
              Applied:
                type: object
                required: [row, version, values]
                properties:
                  row: { type: string, format: uuid, description: New product ID for copy, original ID for update }
                  version: { type: string, format: date-time }
                  values:
                    type: object
                    description: Product grid schema 1 values keyed by column ID
                    additionalProperties: { type: string }
          - type: object
            required: [Rejected]
            properties:
              Rejected:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, enum: [NOT_FOUND, VERSION_CONFLICT, DUPLICATE_CODE, TOO_MANY_SKUS, TOO_MANY_COMPONENTS, INVALID_BOM] }
                  message: { type: string }
  SkuActionCommand:
    type: object
    additionalProperties: false
    required: [operation_id, action, source, expected_version, values]
    properties:
      operation_id: { type: string, format: uuid, description: Non-nil logical operation identity retained unchanged across lookup and retry }
      action: { type: string, enum: [skus.update] }
      source: { type: string, format: uuid, description: SKU row identity }
      expected_version: { type: string, format: date-time, description: Exact observed SKU updated_at in RFC 3339 form }
      values:
        type: object
        additionalProperties: false
        minProperties: 1
        maxProperties: 5
        description: Editable SKU grid columns only. Text is trimmed. Column 0 code is required and at most 255 UTF-8 bytes; 1 barcode is optional and at most 255 bytes; 2 name is optional and at most 500 bytes; 4 cost is empty for NULL or a nonnegative decimal with at most two fractional digits whose cents fit int64; 5 is exactly true or false and also sets status ACTIVE or INACTIVE. Kind, status, and dates are read-only. KIT cost is BOM-derived and rejected when submitted.
        properties:
          '0': { type: string, minLength: 1, maxLength: 255, description: Non-empty SKU code }
          '1': { type: string, maxLength: 255, description: Barcode; empty clears it }
          '2': { type: string, maxLength: 500, description: Name; empty clears it }
          '4': { type: string, pattern: '^(|[0-9]+([.][0-9]{1,2})?)$', description: Exact monetary decimal; empty clears cost }
          '5': { type: string, enum: ['true', 'false'], description: Active flag; synchronizes status }
  SkuActionReceipt:
    type: object
    additionalProperties: false
    required: [operation_id, source, command_fingerprint, outcome]
    properties:
      operation_id: { type: string, format: uuid }
      source: { type: string, format: uuid }
      command_fingerprint:
        type: string
        pattern: '^sha256-v1:[a-f0-9]{64}$'
        description: Fingerprint of the immutable typed command; clients verify it together with operation_id and source.
      outcome:
        oneOf:
          - type: object
            additionalProperties: false
            required: [Applied]
            properties:
              Applied:
                type: object
                additionalProperties: false
                required: [row, version, values]
                properties:
                  row: { type: string, format: uuid }
                  version: { type: string, format: date-time }
                  values:
                    type: object
                    additionalProperties: false
                    required: ['0', '1', '2', '3', '4', '5', '6', '7', '8']
                    description: Complete SKU grid schema 1 row. Cost is fixed to two decimals and is BOM-derived for KIT rows.
                    properties:
                      '0': { type: string, description: SKU code }
                      '1': { type: string, description: Barcode or empty }
                      '2': { type: string, description: Name or empty }
                      '3': { type: string, description: Read-only SKU kind }
                      '4': { type: string, pattern: '^-?[0-9]+[.][0-9]{2}$|^$', description: Cost or empty }
                      '5': { type: string, enum: ['true', 'false'] }
                      '6': { type: string, description: Read-only status }
                      '7': { type: string, format: date-time }
                      '8': { type: string, format: date-time }
          - type: object
            additionalProperties: false
            required: [Rejected]
            properties:
              Rejected:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: { type: string, enum: [NOT_FOUND, VERSION_CONFLICT, DUPLICATE_CODE, KIT_COST_READ_ONLY] }
                  message: { type: string }
  ProductGridQuery:
    type: object
    additionalProperties: false
    required: [schema, offset, limit]
    properties:
      schema: { type: integer, enum: [1] }
      offset: { type: integer, format: int64, minimum: 0 }
      limit: { type: integer, minimum: 1, maximum: 500 }
      search:
        type: string
        nullable: true
        description: Literal substring across name, code, alias and barcode; maximum 4096 UTF-8 bytes, no NUL
      filters:
        type: object
        description: Keys are column IDs 0 code, 1 name, 2 brand, 3 category, 4 status, 5 created_at UTC, 6 updated_at UTC. Columns 0-4 accept Text or Enum; 5-6 accept DateTime. Conditions combine with AND.
        maxProperties: 7
        additionalProperties:
          $ref: '#/components/schemas/ProductGridFilter'
      sorts:
        type: array
        maxItems: 7
        description: Ordered priorities, unique column IDs; product_id descending breaks ties. Empty sorts default to created_at descending. Text is case-insensitive, empty values last.
        items:
          type: object
          required: [column, descending]
          properties:
            column: { type: integer, minimum: 0, maximum: 6 }
            descending: { type: boolean }
      expression:
        allOf:
          - $ref: '#/components/schemas/ProductGridExpression'
        nullable: true
        description: Optional nested expression, combined with quick filters and search using AND. Maximum 8 levels and 64 nodes.
  ProductGridExpression:
    oneOf:
      - type: object
        required: [Condition]
        additionalProperties: false
        properties:
          Condition:
            type: object
            additionalProperties: false
            required: [column, filter]
            properties:
              column: { type: integer, minimum: 0, maximum: 6 }
              filter: { $ref: '#/components/schemas/ProductGridFilter' }
      - type: object
        required: [And]
        additionalProperties: false
        properties:
          And:
            type: array
            minItems: 1
            maxItems: 63
            items: { $ref: '#/components/schemas/ProductGridExpression' }
      - type: object
        required: [Or]
        additionalProperties: false
        properties:
          Or:
            type: array
            minItems: 1
            maxItems: 63
            items: { $ref: '#/components/schemas/ProductGridExpression' }
  ProductGridFilter:
    oneOf:
      - type: object
        required: [Text]
        additionalProperties: false
        properties:
          Text: { type: string, description: Literal case-insensitive substring; max 4096 UTF-8 bytes, no NUL }
      - type: object
        required: [Enum]
        additionalProperties: false
        properties:
          Enum:
            type: array
            minItems: 1
            maxItems: 100
            uniqueItems: true
            items: { type: string, description: Exact value; max 4096 UTF-8 bytes, no NUL. Empty string also matches NULL. }
      - type: object
        required: [DateTime]
        additionalProperties: false
        properties:
          DateTime:
            type: object
            properties:
              start: { type: integer, format: int64, nullable: true, description: Inclusive UTC civil YYYYMMDDHHMMSS key, years 1900-2100 }
              end: { type: integer, format: int64, nullable: true, description: Inclusive UTC civil second, including fractional timestamps within that second }
  ProductOptionQuery:
    type: object
    additionalProperties: false
    required: [query, column, offset, limit]
    properties:
      query:
        $ref: '#/components/schemas/ProductGridQuery'
      column: { type: integer, enum: [2, 3, 4], description: Brand, category, or status }
      search: { type: string, nullable: true, description: Literal substring, trimmed; maximum 4096 UTF-8 bytes and no NUL }
      offset: { type: integer, format: int64, minimum: 0 }
      limit: { type: integer, minimum: 1, maximum: 100 }
  ProductOptionPage:
    type: object
    required: [values, total]
    properties:
      total: { type: integer, format: int64, minimum: 0 }
      values:
        type: array
        maxItems: 100
        uniqueItems: true
        items: { type: string, description: Empty string represents NULL or empty values }
  ProductGridPage:
    type: object
    required: [data, total]
    properties:
      total: { type: integer, format: int64, minimum: 0 }
      data:
        type: array
        maxItems: 500
        items:
          type: object
          required: [product_id, tenant_id, name, status, created_at, updated_at]
          properties:
            product_id: { type: string, format: uuid }
            tenant_id: { type: string, format: uuid }
            product_code: { type: string, nullable: true }
            name: { type: string }
            brand: { type: string, nullable: true }
            category: { type: string, nullable: true }
            status: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
  LoginRequest:
    type: object
    required: [tenant_id, email, password]
    properties:
      tenant_id: { type: string }
      email: { type: string }
      password: { type: string }
  LoginResponse:
    type: object
    required: [access_token, token_type, expires_in]
    properties:
      access_token: { type: string }
      token_type: { type: string }
      expires_in: { type: integer, format: int64 }
  RefundState:
    type: string
    enum: [NONE, PROCESSING, SUCCESS, CLOSED, UNKNOWN]
  AfterSaleState:
    type: string
    enum: [NONE, PROCESSING, SUCCESS, CLOSED, UNKNOWN]
  AfterSaleCase:
    type: object
    required:
      [
        case_id,
        tenant_id,
        platform,
        shop_id,
        after_sale_id,
        refund_state,
        after_sale_state,
        refund_amount_cent,
        item_count,
        total_qty,
        order_count,
        created_at,
        updated_at,
      ]
    properties:
      case_id: { type: string }
      tenant_id: { type: string }
      platform: { type: string }
      shop_id: { type: string }
      after_sale_id: { type: string }
      after_sale_type: { type: string, nullable: true }
      refund_state: { $ref: "#/components/schemas/RefundState" }
      after_sale_state: { $ref: "#/components/schemas/AfterSaleState" }
      refund_amount_cent: { type: integer, format: int64 }
      item_count: { type: integer, format: int32 }
      total_qty: { type: integer, format: int32 }
      order_count: { type: integer, format: int32 }
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
  AfterSaleCaseItem:
    type: object
    required:
      [
        tenant_id,
        case_id,
        order_id,
        order_month,
        line_id,
        qty,
        refund_state,
        after_sale_state,
        return_stocked,
      ]
    properties:
      tenant_id: { type: string }
      case_id: { type: string }
      order_id: { type: string }
      order_month: { type: string, format: date }
      line_id: { type: string }
      sku_id: { type: string, nullable: true }
      title: { type: string, nullable: true }
      return_stocked: { type: boolean }
      return_warehouse_id: { type: string, nullable: true }
      return_at: { type: string, format: date-time, nullable: true }
      qty: { type: integer, format: int32 }
      refund_state: { $ref: "#/components/schemas/RefundState" }
      after_sale_state: { $ref: "#/components/schemas/AfterSaleState" }
      refund_amount_cent: { type: integer, format: int64, nullable: true }
      after_sale_type: { type: string, nullable: true }
  AfterSaleCaseDetail:
    type: object
    required: [case, items]
    properties:
      case:
        $ref: "#/components/schemas/AfterSaleCase"
      items:
        type: array
        items:
          $ref: "#/components/schemas/AfterSaleCaseItem"
  AfterSaleCaseListResponse:
    type: object
    required: [data, limit, offset]
    properties:
      data:
        type: array
        items:
          $ref: "#/components/schemas/AfterSaleCase"
      limit: { type: integer, format: int64 }
      offset: { type: integer, format: int64 }
  AfterSaleCaseSummary:
    type: object
    required: [case_id, tenant_id, shop_id, platform, case_status, updated_at]
    properties:
      case_id: { type: string }
      tenant_id: { type: string }
      shop_id: { type: string }
      platform: { type: string }
      case_status: { type: string }
      platform_order_id: { type: string, nullable: true }
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
  AfterSalesType:
    type: string
    enum: [REFUND_ONLY, RETURN_REFUND, EXCHANGE, RESEND]
  AfterSalesStatus:
    type: string
    enum: [OPEN, APPROVED, RECEIVED, REFUNDED, CLOSED, REJECTED]
  AfterSaleStatus:
    type: string
    enum: [SUBMITTED, PENDING_REVIEW, ACCEPTED, REJECTED, CLOSED]
  CompensationStatus:
    type: string
    enum: [NOT_REQUIRED, PENDING_APPROVAL, APPROVED, PAID, REJECTED]
  EvidenceStatus:
    type: string
    enum: [NOT_REQUIRED, REQUIRED, SUBMITTED, VERIFIED, REJECTED]
  ReturnStatus:
    type: string
    enum: [WAITING_RETURN, IN_TRANSIT, WAITING_RECEIPT, QC_CHECKING, QC_PASSED, QC_FAILED]
  RefundDocStatus:
    type: string
    enum: [PENDING_APPROVAL, PENDING_REFUND, REFUNDED, REFUND_FAILED]
  ReturnReceiptStatus:
    type: string
    enum: [RECEIVING, PUTAWAY_DONE]
  RefundStatus:
    type: string
    enum: [PENDING, SENT, FAILED, DONE]
  RefundChannel:
    type: string
    enum: [PLATFORM, MANUAL]
  AfterSalesItemInput:
    type: object
    required: [sku_id, qty, refund_cent]
    properties:
      sku_id: { type: string }
      qty: { type: integer, format: int64 }
      refund_cent: { type: integer, format: int64 }
  AfterSalesCreateRequest:
    type: object
    required: [order_id, type, items]
    properties:
      order_id: { type: string }
      type: { $ref: "#/components/schemas/AfterSalesType" }
      reason_code: { type: string, nullable: true }
      amount_cent: { type: integer, format: int64, nullable: true }
      compensation_status:
        $ref: "#/components/schemas/CompensationStatus"
        nullable: true
      evidence_status:
        $ref: "#/components/schemas/EvidenceStatus"
        nullable: true
      items:
        type: array
        items:
          $ref: "#/components/schemas/AfterSalesItemInput"
  AfterSalesReceiveRequest:
    type: object
    required: [warehouse_id]
    properties:
      warehouse_id: { type: string }
      putaway_done: { type: boolean, nullable: true }
  AfterSalesRefundRequest:
    type: object
    properties:
      amount_cent: { type: integer, format: int64, nullable: true }
      channel: { $ref: "#/components/schemas/RefundChannel" }
  AfterSalesItem:
    type: object
    required: [sku_id, qty, refund_cent]
    properties:
      sku_id: { type: string }
      qty: { type: integer, format: int64 }
      refund_cent: { type: integer, format: int64 }
  AfterSales:
    type: object
    required:
      [id, tenant_id, order_id, type, status, after_sale_status, amount_cent, created_at, updated_at]
    properties:
      id: { type: string }
      tenant_id: { type: string }
      order_id: { type: string }
      type: { $ref: "#/components/schemas/AfterSalesType" }
      status: { $ref: "#/components/schemas/AfterSalesStatus" }
      after_sale_status: { $ref: "#/components/schemas/AfterSaleStatus" }
      compensation_status:
        $ref: "#/components/schemas/CompensationStatus"
        nullable: true
      evidence_status:
        $ref: "#/components/schemas/EvidenceStatus"
        nullable: true
      reason_code: { type: string, nullable: true }
      amount_cent: { type: integer, format: int64 }
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
  ReturnReceipt:
    type: object
    required:
      [id, after_sales_id, warehouse_id, status, return_status, created_at, updated_at]
    properties:
      id: { type: string }
      after_sales_id: { type: string }
      warehouse_id: { type: string }
      status: { $ref: "#/components/schemas/ReturnReceiptStatus" }
      return_status: { $ref: "#/components/schemas/ReturnStatus" }
      received_at: { type: string, format: date-time, nullable: true }
      putaway_at: { type: string, format: date-time, nullable: true }
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
  RefundDoc:
    type: object
    required:
      [id, after_sales_id, amount_cent, status, refund_status, channel, created_at, updated_at]
    properties:
      id: { type: string }
      after_sales_id: { type: string }
      amount_cent: { type: integer, format: int64 }
      status: { $ref: "#/components/schemas/RefundStatus" }
      refund_status: { $ref: "#/components/schemas/RefundDocStatus" }
      channel: { $ref: "#/components/schemas/RefundChannel" }
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
  AfterSalesDetail:
    type: object
    required: [after_sales, items, raw_json, audit_logs]
    properties:
      after_sales:
        $ref: "#/components/schemas/AfterSales"
      items:
        type: array
        items:
          $ref: "#/components/schemas/AfterSalesItem"
      return_receipt:
        allOf:
          - $ref: "#/components/schemas/ReturnReceipt"
        nullable: true
      refund_doc:
        allOf:
          - $ref: "#/components/schemas/RefundDoc"
        nullable: true
      raw_json:
        type: object
        additionalProperties: true
      audit_logs:
        type: array
        items:
          $ref: "#/components/schemas/AfterSalesAuditLog"
  AfterSalesAuditLog:
    type: object
    required: [audit_id, action, created_at]
    properties:
      audit_id: { type: string }
      action: { type: string }
      user_id: { type: string, nullable: true }
      before_json:
        type: object
        additionalProperties: true
        nullable: true
      after_json:
        type: object
        additionalProperties: true
        nullable: true
      created_at: { type: string, format: date-time }
  AfterSalesShipmentRequest:
    type: object
    properties:
      origin_shipment_id: { type: string, nullable: true }
      carrier_code: { type: string, nullable: true }
  AfterSalesImportJob:
    type: object
    required:
      [
        job_id,
        file_type,
        status,
        progress,
        total_rows,
        success_rows,
        failed_rows,
        attempts,
        last_error,
        created_at,
        updated_at,
      ]
    properties:
      job_id: { type: string }
      file_name: { type: string, nullable: true }
