  ExportJobCreateRequest:
    type: object
    required: [type]
    properties:
      type: { type: string }
      params:
        type: object
        description: >
          Export parameters. For ORDER_EXPORT/RECONCILE_EXPORT accepts start_at/end_at (RFC3339),
          platform/shop_id filters. For RECONCILE_EXPORT, job_id (uuid) and diff_only (bool)
          export reconcile job items. For INVENTORY_EXPORT accepts warehouse_id.
          PRODUCT_EXPORT requires request_id (UUID, reused for retries), exports.write and skus.read.
          Provide exactly one of query (ProductGridQuery), checked (ids and sorts), or selection
          (token UUID, excluded unique non-nil UUID array limited to 10000, sorts array).
          Query exports every matching row; offset and limit do not restrict output.
          Query snapshot starts when the worker opens it, with 1000000 rows and 1 GiB CSV limits.
          Selection exports frozen field values minus excluded members in the supplied sort order.
          Accepted selection jobs retain their data independently of selection token expiry.
          Checked accepts 1 to 100000 unique non-nil UUIDs, captures all IDs across pages at acceptance,
          and rejects the whole request if any ID is missing, deleted or belongs to another tenant.
          Checked jobs reuse the retained snapshot, audit and retry lifecycle.
          The export jobs route accepts a bounded 8 MiB request body.
          Expired or unavailable selection returns 410; invalid exclusions return 400.
          Reusing an identity with a different actor or source returns 409.
        additionalProperties: true
  ExportJob:
    type: object
    required:
      [
        job_id,
        tenant_id,
        type,
        params,
        status,
        progress,
        attempts,
        last_error,
        created_at,
        updated_at,
      ]
    properties:
      job_id: { type: string }
      tenant_id: { type: string }
      type: { type: string }
