      query: { $ref: "#/components/schemas/InventoryExportQuery" }
  InventoryExportArtifact:
    type: object
    additionalProperties: false
    required: [schema, quantity_scale, snapshot_at, rows, bytes, sha256]
    properties:
      schema: { type: integer, enum: [2] }
      quantity_scale: { type: integer, enum: [6] }
      snapshot_at: { type: string, format: date-time }
      rows: { type: integer, format: int64, minimum: 0, maximum: 1000000 }
      bytes: { type: integer, format: int64, minimum: 1, maximum: 1073741824 }
      sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
  InventoryExportSpec:
    type: object
    additionalProperties: false
    required: [schema, request_id, actor_user_id, query, warehouse_ids, restricted_at_admission, artifact]
    properties:
      schema: { type: integer, enum: [2] }
      request_id: { type: string, format: uuid }
      actor_user_id: { type: string, format: uuid, description: Stored by server; cannot be supplied in request params. }
      query: { $ref: "#/components/schemas/InventoryExportQuery" }
      warehouse_ids:
        type: array
        maxItems: 10000
        uniqueItems: true
        description: Server-owned admission scope sorted by UUID; later grants never expand this membership.
        items: { type: string, format: uuid }
      restricted_at_admission: { type: boolean, description: Removing all grants cannot convert an already restricted job into legacy unrestricted access. }
      artifact:
        nullable: true
        allOf:
          - $ref: "#/components/schemas/InventoryExportArtifact"
  ExportJobCreateRequest:
    type: object
    required: [type]
    properties:
      type: { type: string }
      params:
        type: object
        description: >
          Export parameters. For ORDER_EXPORT/RECONCILE_EXPORT accepts start_at/end_at (RFC3339),
          platform/shop_id filters. For RECONCILE_EXPORT, job_id (uuid) and diff_only (bool)
          export reconcile job items. INVENTORY_EXPORT requires InventoryExportRequest params,
          exports.write and inventory.read, plus current stored permissions and an ACTIVE actor.
          Only request_id and query are accepted; actor/scope/artifact are server-owned.
          Accepted warehouse membership is held, while inventory data snapshot begins in the worker.
          Version 2 CSV keeps the first six column names but uses exact decimal basic units;
          available equals on_hand minus reserved minus frozen; adds frozen, in_transit,
          quantity_scale and snapshot_at. Invalid/unknown quantities fail instead of using projections.
          The inventory job and its audit commit atomically, with limits 1000000 rows/1 GiB.
          Worker fetch is 1..1000 rows; generation/retry verification timeout is 300 seconds.
          Same actor/request/query returns the original job; changed actor/query returns 409.
          Inventory metadata and download require the original actor, inventory.read/exports.read
          and a fresh scope check. Ownerless legacy inventory jobs require a new request.
          PRODUCT_EXPORT requires request_id (UUID, reused for retries), exports.write and skus.read.
          Provide exactly one of query (ProductGridQuery), checked (ids and sorts), or selection
          (token UUID, excluded unique non-nil UUID array limited to 10000, sorts array).
          Query exports every matching row; offset and limit do not restrict output.
          Query snapshot starts when the worker opens it, with 1000000 rows and 1 GiB CSV limits.
          Selection exports frozen field values minus excluded members in the supplied sort order.
          Accepted selection jobs retain their data independently of selection token expiry.
          Checked accepts 1 to 100000 unique non-nil UUIDs, captures all IDs across pages at acceptance,
          and rejects the whole request if any ID is missing, deleted or belongs to another tenant.
          Checked jobs reuse the retained snapshot, audit and retry lifecycle.
          The export jobs route accepts a bounded 8 MiB request body.
          Expired or unavailable selection returns 410; invalid exclusions return 400.
          Reusing an identity with a different actor or source returns 409.
        additionalProperties: true
    oneOf:
      - required: [type, params]
        properties:
          type: { type: string, enum: [INVENTORY_EXPORT] }
          params: { $ref: "#/components/schemas/InventoryExportRequest" }
      - properties:
          type: { type: string, enum: [ORDER_EXPORT, RECONCILE_EXPORT, PRODUCT_EXPORT] }
