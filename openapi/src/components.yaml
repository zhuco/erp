securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT
schemas:
  SkuGridQuery:
    type: object
    additionalProperties: false
    required: [schema, offset, limit]
    properties:
      schema: { type: integer, enum: [1] }
      offset: { type: integer, format: int64, minimum: 0 }
      limit: { type: integer, minimum: 1, maximum: 500 }
      search: { type: string, nullable: true, description: Literal case-insensitive substring in code/name/barcode/tags; maximum 4096 UTF-8 bytes without NUL }
      filters:
        type: object
        maxProperties: 9
        description: Columns 0 code, 1 barcode, 2 name, 3 kind, 4 cost in cents, 5 active, 6 status, 7 created UTC, 8 updated UTC. Text/Enum for 0-3 and 6; Money for 4; Enum true/false for 5; DateTime for 7-8. Conditions combine with AND.
        additionalProperties: { $ref: '#/components/schemas/SkuGridFilter' }
      sorts:
        type: array
        maxItems: 8
        description: Unique column priorities followed by stable sku_id descending tie breaker. Empty order defaults to created_at descending; NULL/empty last.
        items:
          type: object
          required: [column, descending]
          properties:
            column: { type: integer, minimum: 0, maximum: 8 }
            descending: { type: boolean }
      expression:
        allOf:
          - $ref: '#/components/schemas/SkuGridExpression'
        nullable: true
        description: Nested AND/OR, maximum 64 nodes and 8 levels; combined with quick filters and global search by AND.
  SkuGridFilter:
    oneOf:
      - $ref: '#/components/schemas/ProductGridFilter'
      - type: object
        required: [Money]
        additionalProperties: false
        properties:
          Money:
            type: object
            properties:
              min: { type: integer, format: int64, nullable: true, description: Inclusive cost in cents }
              max: { type: integer, format: int64, nullable: true, description: Inclusive cost in cents }
  SkuGridExpression:
    oneOf:
      - type: object
        required: [Condition]
        additionalProperties: false
        properties:
          Condition:
            type: object
            additionalProperties: false
            required: [column, filter]
            properties:
              column: { type: integer, minimum: 0, maximum: 8 }
              filter: { $ref: '#/components/schemas/SkuGridFilter' }
      - type: object
        required: [And]
        additionalProperties: false
        properties:
          And:
            type: array
            minItems: 1
            maxItems: 63
            items: { $ref: '#/components/schemas/SkuGridExpression' }
      - type: object
        required: [Or]
        additionalProperties: false
        properties:
          Or:
            type: array
            minItems: 1
            maxItems: 63
            items: { $ref: '#/components/schemas/SkuGridExpression' }
  SkuGridPage:
    type: object
    required: [data, total]
    properties:
      total: { type: integer, format: int64, minimum: 0 }
      data:
        type: array
        maxItems: 500
        items: { $ref: '#/components/schemas/SkuGridRow' }
  SkuGridRow:
    type: object
    required: [sku_id, tenant_id, product_id, sku_code, sku_kind, is_active, status, created_at, updated_at]
    properties:
      sku_id: { type: string, format: uuid }
      tenant_id: { type: string, format: uuid }
      product_id: { type: string, format: uuid }
      sku_code: { type: string }
      barcode: { type: string, nullable: true }
      name: { type: string, nullable: true }
      sku_kind: { type: string }
      cost_cent: { type: integer, format: int64, nullable: true }
      is_active: { type: boolean }
      status: { type: string }
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
  SkuGridRangesRequest:
    type: object
    additionalProperties: false
    required: [query, ranges]
    properties:
      query: { $ref: '#/components/schemas/SkuGridQuery' }
      ranges:
        type: array
        minItems: 1
        maxItems: 2
        description: Overlap is allowed; combined limits must not exceed 2000 rows.
        items:
          type: object
          additionalProperties: false
          required: [offset, limit]
          properties:
            offset: { type: integer, format: int64, minimum: 0, maximum: 9223372036854775806 }
            limit: { type: integer, minimum: 1, maximum: 1000 }
  SkuGridRangesPage:
    type: object
    required: [total, pages]
    properties:
      total: { type: integer, format: int64, minimum: 0 }
      pages:
        type: array
        minItems: 1
        maxItems: 2
        items:
          type: object
          required: [offset, data]
          properties:
            offset: { type: integer, format: int64, minimum: 0 }
            data:
              type: array
              maxItems: 1000
              items: { $ref: '#/components/schemas/SkuGridRow' }
  ProductActionCommand:
    type: object
    additionalProperties: false
    required: [operation_id, action, source]
    properties:
      operation_id: { type: string, format: uuid, description: Non-nil logical operation identity retained across retries }
      action: { type: string, enum: [products.copy, products.update] }
      source: { type: string, format: uuid }
      expected_version: { type: string, format: date-time, nullable: true, description: Exact observed updated_at; mandatory for update, optional snapshot guard for copy }
      values:
        type: object
        maxProperties: 4
        description: Copy requires empty values. Update permits IDs 0 code, 1 name, 2 brand, 3 category; maximum 4096 UTF-8 bytes per value, no NUL. Values are trimmed; empty optional fields become NULL, name cannot be empty.
        additionalProperties: { type: string }
  ProductActionReceipt:
    type: object
    required: [operation_id, source, command_fingerprint, outcome]
    properties:
      operation_id: { type: string, format: uuid }
      source: { type: string, format: uuid }
      command_fingerprint:
        type: string
        pattern: '^sha256-v1:[a-f0-9]{64}$'
        description: Versioned SHA-256 fingerprint of the immutable typed ActionCommand. Clients must match it as well as operation_id and source before accepting a receipt; a reused identity may belong to different field values or a different expected version.
      outcome:
        oneOf:
          - type: object
            required: [Applied]
            properties:
              Applied:
                type: object
                required: [row, version, values]
                properties:
                  row: { type: string, format: uuid, description: New product ID for copy, original ID for update }
                  version: { type: string, format: date-time }
                  values:
                    type: object
                    description: Product grid schema 1 values keyed by column ID
                    additionalProperties: { type: string }
          - type: object
            required: [Rejected]
            properties:
              Rejected:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, enum: [NOT_FOUND, VERSION_CONFLICT, DUPLICATE_CODE, TOO_MANY_SKUS, TOO_MANY_COMPONENTS, INVALID_BOM] }
                  message: { type: string }
  SkuActionCommand:
    type: object
    additionalProperties: false
    required: [operation_id, action, source, expected_version, values]
    properties:
      operation_id: { type: string, format: uuid, description: Non-nil logical operation identity retained unchanged across lookup and retry }
      action: { type: string, enum: [skus.update] }
      source: { type: string, format: uuid, description: SKU row identity }
      expected_version: { type: string, format: date-time, description: Exact observed SKU updated_at in RFC 3339 form }
      values:
        type: object
        additionalProperties: false
        minProperties: 1
        maxProperties: 5
        description: Editable SKU grid columns only. Text is trimmed. Column 0 code is required and at most 255 UTF-8 bytes; 1 barcode is optional and at most 255 bytes; 2 name is optional and at most 500 bytes; 4 cost is empty for NULL or a nonnegative decimal with at most two fractional digits whose cents fit int64; 5 is exactly true or false and also sets status ACTIVE or INACTIVE. Kind, status, and dates are read-only. KIT cost is BOM-derived and rejected when submitted.
        properties:
          '0': { type: string, minLength: 1, maxLength: 255, description: Non-empty SKU code }
          '1': { type: string, maxLength: 255, description: Barcode; empty clears it }
          '2': { type: string, maxLength: 500, description: Name; empty clears it }
          '4': { type: string, pattern: '^(|[0-9]+([.][0-9]{1,2})?)$', description: Exact monetary decimal; empty clears cost }
          '5': { type: string, enum: ['true', 'false'], description: Active flag; synchronizes status }
  SkuActionReceipt:
    type: object
    additionalProperties: false
    required: [operation_id, source, command_fingerprint, outcome]
    properties:
      operation_id: { type: string, format: uuid }
      source: { type: string, format: uuid }
      command_fingerprint:
        type: string
        pattern: '^sha256-v1:[a-f0-9]{64}$'
        description: Fingerprint of the immutable typed command; clients verify it together with operation_id and source.
      outcome:
        oneOf:
          - type: object
            additionalProperties: false
            required: [Applied]
            properties:
              Applied:
                type: object
                additionalProperties: false
                required: [row, version, values]
                properties:
                  row: { type: string, format: uuid }
                  version: { type: string, format: date-time }
                  values:
                    type: object
                    additionalProperties: false
                    required: ['0', '1', '2', '3', '4', '5', '6', '7', '8']
                    description: Complete SKU grid schema 1 row. Cost is fixed to two decimals and is BOM-derived for KIT rows.
                    properties:
                      '0': { type: string, description: SKU code }
                      '1': { type: string, description: Barcode or empty }
                      '2': { type: string, description: Name or empty }
                      '3': { type: string, description: Read-only SKU kind }
                      '4': { type: string, pattern: '^-?[0-9]+[.][0-9]{2}$|^$', description: Cost or empty }
                      '5': { type: string, enum: ['true', 'false'] }
                      '6': { type: string, description: Read-only status }
                      '7': { type: string, format: date-time }
                      '8': { type: string, format: date-time }
          - type: object
            additionalProperties: false
            required: [Rejected]
            properties:
              Rejected:
                type: object
                additionalProperties: false
                required: [code, message]
                properties:
                  code: { type: string, enum: [NOT_FOUND, VERSION_CONFLICT, DUPLICATE_CODE, KIT_COST_READ_ONLY] }
                  message: { type: string }
  ProductGridQuery:
    type: object
    additionalProperties: false
    required: [schema, offset, limit]
    properties:
      schema: { type: integer, enum: [1] }
      offset: { type: integer, format: int64, minimum: 0 }
      limit: { type: integer, minimum: 1, maximum: 500 }
      search:
        type: string
        nullable: true
        description: Literal substring across name, code, alias and barcode; maximum 4096 UTF-8 bytes, no NUL
      filters:
        type: object
        description: Keys are column IDs 0 code, 1 name, 2 brand, 3 category, 4 status, 5 created_at UTC, 6 updated_at UTC. Columns 0-4 accept Text or Enum; 5-6 accept DateTime. Conditions combine with AND.
        maxProperties: 7
        additionalProperties:
          $ref: '#/components/schemas/ProductGridFilter'
      sorts:
        type: array
        maxItems: 7
        description: Ordered priorities, unique column IDs; product_id descending breaks ties. Empty sorts default to created_at descending. Text is case-insensitive, empty values last.
        items:
          type: object
          required: [column, descending]
          properties:
            column: { type: integer, minimum: 0, maximum: 6 }
            descending: { type: boolean }
      expression:
        allOf:
          - $ref: '#/components/schemas/ProductGridExpression'
        nullable: true
        description: Optional nested expression, combined with quick filters and search using AND. Maximum 8 levels and 64 nodes.
  ProductGridExpression:
    oneOf:
      - type: object
        required: [Condition]
        additionalProperties: false
        properties:
          Condition:
            type: object
            additionalProperties: false
            required: [column, filter]
            properties:
              column: { type: integer, minimum: 0, maximum: 6 }
              filter: { $ref: '#/components/schemas/ProductGridFilter' }
      - type: object
        required: [And]
        additionalProperties: false
        properties:
          And:
            type: array
            minItems: 1
            maxItems: 63
            items: { $ref: '#/components/schemas/ProductGridExpression' }
      - type: object
        required: [Or]
        additionalProperties: false
        properties:
          Or:
            type: array
            minItems: 1
            maxItems: 63
            items: { $ref: '#/components/schemas/ProductGridExpression' }
  ProductGridFilter:
    oneOf:
      - type: object
        required: [Text]
        additionalProperties: false
        properties:
          Text: { type: string, description: Literal case-insensitive substring; max 4096 UTF-8 bytes, no NUL }
      - type: object
        required: [Enum]
        additionalProperties: false
        properties:
          Enum:
            type: array
            minItems: 1
            maxItems: 100
            uniqueItems: true
            items: { type: string, description: Exact value; max 4096 UTF-8 bytes, no NUL. Empty string also matches NULL. }
      - type: object
        required: [DateTime]
        additionalProperties: false
        properties:
          DateTime:
            type: object
            properties:
              start: { type: integer, format: int64, nullable: true, description: Inclusive UTC civil YYYYMMDDHHMMSS key, years 1900-2100 }
              end: { type: integer, format: int64, nullable: true, description: Inclusive UTC civil second, including fractional timestamps within that second }
  ProductOptionQuery:
    type: object
    additionalProperties: false
    required: [query, column, offset, limit]
    properties:
      query:
        $ref: '#/components/schemas/ProductGridQuery'
      column: { type: integer, enum: [2, 3, 4], description: Brand, category, or status }
      search: { type: string, nullable: true, description: Literal substring, trimmed; maximum 4096 UTF-8 bytes and no NUL }
      offset: { type: integer, format: int64, minimum: 0 }
      limit: { type: integer, minimum: 1, maximum: 100 }
  ProductOptionPage:
    type: object
    required: [values, total]
    properties:
      total: { type: integer, format: int64, minimum: 0 }
      values:
        type: array
        maxItems: 100
        uniqueItems: true
        items: { type: string, description: Empty string represents NULL or empty values }
  ProductGridPage:
    type: object
    required: [data, total]
    properties:
      total: { type: integer, format: int64, minimum: 0 }
      data:
        type: array
        maxItems: 500
        items:
          type: object
          required: [product_id, tenant_id, name, status, created_at, updated_at]
          properties:
            product_id: { type: string, format: uuid }
            tenant_id: { type: string, format: uuid }
            product_code: { type: string, nullable: true }
            name: { type: string }
            brand: { type: string, nullable: true }
            category: { type: string, nullable: true }
            status: { type: string }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
  LoginRequest:
    type: object
    required: [tenant_id, email, password]
    properties:
      tenant_id: { type: string }
      email: { type: string }
      password: { type: string }
      client_kind:
        type: string
        enum: [DESKTOP, WEB, UNKNOWN]
      client_label: { type: string, maxLength: 80 }
  LoginResponse:
    type: object
    required: [access_token, token_type, expires_in, session_id, session_policy]
    properties:
      access_token: { type: string }
      token_type: { type: string }
      expires_in: { type: integer, format: int64 }
      session_id: { type: string, format: uuid }
      session_policy: { type: string, enum: [MULTI, SINGLE] }
  ManufacturingBomLine:
    type: object
    required: [parent, component, qty_per]
    properties:
      parent: { type: string }
      component: { type: string }
      qty_per: { type: string, description: "Decimal quantity per parent, six fractional digits maximum" }
  ManufacturingBomRequest:
    type: object
    required: [request_id, product_code, items]
    properties:
      request_id: { type: string }
      product_code: { type: string }
      items:
        type: array
        items: { $ref: "#/components/schemas/ManufacturingBomLine" }
  ManufacturingRoutingStep:
    type: object
    required: [operation, sequence, work_center, minutes_per, inspection_required]
    properties:
      operation: { type: string }
      sequence: { type: integer }
      work_center: { type: string }
      minutes_per: { type: integer, format: int64 }
      inspection_required: { type: boolean }
  ManufacturingRoutingRequest:
    type: object
    required: [request_id, product_code, steps]
    properties:
      request_id: { type: string }
      product_code: { type: string }
      steps:
        type: array
        items: { $ref: "#/components/schemas/ManufacturingRoutingStep" }
  RoutingChangeRequest:
    type: object
    additionalProperties: false
    required: [request_id, product_code, approver, steps]
    properties:
      request_id: { type: string }
      product_code: { type: string }
      approver: { type: string }
      steps:
        type: array
        items: { $ref: "#/components/schemas/ManufacturingRoutingStep" }
  ManufacturingExecutionRequest:
    type: object
    required: [request_id, work_order_no, issued, consumed, good, rejected, received, material_cost_cent, labor_minutes, labor_rate_cent]
    properties:
      request_id: { type: string }
      work_order_no: { type: string }
      issued: { type: string }
      consumed: { type: string }
      good: { type: string }
      rejected: { type: string }
      received: { type: string }
      material_cost_cent: { type: integer, format: int64 }
      labor_minutes: { type: integer, format: int64 }
      labor_rate_cent: { type: integer, format: int64 }
  WorkOrderCreateRequest:
    type: object
    required: [request_id, work_order_no, product_code, order_qty]
    properties:
      request_id: { type: string }
      work_order_no: { type: string }
      product_code: { type: string }
      bom_id: { type: string, format: uuid }
      order_qty: { type: string, description: "Decimal quantity, six fractional digits maximum" }
  AtomicEffectRequest:
    type: object
    additionalProperties: false
    required: [request_id, warehouse_id, sku_id, source_action, action_no, qty, amount_cent, prepared_lines, failing_line]
    properties:
      request_id: { type: string }
      warehouse_id: { type: string, format: uuid }
      sku_id: { type: string, format: uuid }
      source_action: { type: string, enum: [ISSUE] }
      action_no: { type: string, minLength: 1, description: "Trimmed UTF-8 value must have at most 128 bytes and no control characters" }
      qty: { type: string, minLength: 1, description: "Positive decimal base quantity; at most six fractional digits" }
      amount_cent: { type: integer, format: int64, minimum: 0, description: "Declaration compared with the rounded server quantity times SKU cost; exact subcent value remains in the snapshot" }
      prepared_lines: { type: integer, format: int64, enum: [1], description: "Compatibility field. This endpoint commits one actual ISSUE, not a whole document" }
      failing_line: { type: boolean, enum: [false] }
  AtomicEffectResponse:
    type: object
    additionalProperties: false
    required: [request_id, status, replay, effect_id, partial_success, applied_lines, snapshot]
    properties:
      request_id: { type: string }
      status: { type: string, enum: [SUCCEEDED] }
      replay: { type: boolean }
      effect_id: { type: string, format: uuid }
      partial_success: { type: boolean, enum: [false] }
      applied_lines: { type: integer, enum: [1] }
      snapshot: { $ref: "#/components/schemas/AtomicMaterialSnapshot" }
  AtomicMaterialSnapshot:
    type: object
    additionalProperties: false
    required: [schema, document_id, request_id, work_order_id, warehouse_id, sku_id, actor_user_id, action, action_no, move_id, inventory_ledger_id, qty_micros, unit_cost_cent, cost_source, value_cent_micros, amount_cent, material, stock, source, required_micros, operation_log_id, audit_id, outbox_id, posting_id]
    properties:
      schema: { type: integer, enum: [1] }
      document_id: { type: string, format: uuid }
      request_id: { type: string }
      work_order_id: { type: string, format: uuid }
      warehouse_id: { type: string, format: uuid }
      sku_id: { type: string, format: uuid }
      actor_user_id: { type: string, format: uuid, nullable: true }
      action: { type: string, enum: [ISSUE] }
      action_no: { type: string }
      move_id: { type: string, format: uuid }
      inventory_ledger_id: { type: string, format: uuid }
      qty_micros: { type: string, pattern: '^[0-9]+$' }
      unit_cost_cent: { type: integer, format: int64, minimum: 0 }
      cost_source: { type: string, enum: [SKU.cost_cent] }
      value_cent_micros: { type: string, pattern: '^[0-9]+$', description: "Exact cost_cent times qty_micros; one million units equals one cent" }
      amount_cent: { type: integer, format: int64, minimum: 0 }
      required_micros: { type: string, pattern: '^[0-9]+$' }
      material:
        type: object
        additionalProperties: false
        required: [issued_micros, returned_micros, consumed_micros, shop_micros]
        properties:
          issued_micros: { type: string, pattern: '^[0-9]+$' }
          returned_micros: { type: string, pattern: '^[0-9]+$' }
          consumed_micros: { type: string, pattern: '^[0-9]+$' }
          shop_micros: { type: string, pattern: '^[0-9]+$' }
      stock:
        type: object
        additionalProperties: false
        required: [on_hand_micros, reserved_micros, frozen_micros, in_transit_micros, available_micros]
        properties:
          on_hand_micros: { type: string, pattern: '^[0-9]+$' }
          reserved_micros: { type: string, pattern: '^[0-9]+$' }
          frozen_micros: { type: string, pattern: '^[0-9]+$' }
          in_transit_micros: { type: string, pattern: '^[0-9]+$' }
          available_micros: { type: string, pattern: '^[0-9]+$' }
      source:
        type: object
        additionalProperties: false
        required: [version_id, version_no, unit_code, sku_code, order_qty_micros, lines]
        properties:
          version_id: { type: string, format: uuid }
          version_no: { type: integer, minimum: 1 }
          unit_code: { type: string, minLength: 1 }
          sku_code: { type: string }
          order_qty_micros: { type: string, pattern: '^[0-9]+$' }
          lines: { type: array, minItems: 1, maxItems: 1000, items: { type: array, minItems: 6, maxItems: 6, items: { oneOf: [{ type: integer }, { type: string }] } } }
      operation_log_id: { type: string, format: uuid }
      audit_id: { type: string, format: uuid }
      outbox_id: { type: string, format: uuid }
      posting_id: { type: string, format: uuid }
  WorkOrderActionRequest:
    type: object
    required: [request_id, action]
    properties:
      request_id: { type: string }
      action: { type: string, enum: [release, pause, resume, complete, close, cancel] }
      version_id: { type: string, format: uuid, description: "Published BOM version frozen by release" }
      warehouse_id: { type: string, format: uuid, description: "Warehouse whose available stock is reserved by release" }
      sku_id: { type: string, format: uuid, description: "SKU reserved by release" }
      qty: { type: string, description: "Release quantity, or partial completion quantity when action is complete. Six fractional digits maximum. Omit qty on complete to close the order." }
  ProductionReceiptRequest:
    type: object
    additionalProperties: false
    required: [request_id, qty, status, report_id, batch_code, inspection_id, warehouse_id, sku_id]
    properties:
      request_id: { type: string }
      qty: { type: string, description: "Decimal quantity, six fractional digits maximum" }
      status: { type: string, enum: [HOLD, RELEASED] }
      report_id: { type: string, format: uuid }
      batch_code: { type: string }
      inspection_id: { type: string, format: uuid }
      warehouse_id: { type: string, format: uuid }
      sku_id: { type: string, format: uuid }
  ProductionReceiptResponse:
    type: object
    additionalProperties: false
    required: [request_id, status, replay, effect_id, received_micros, available_micros]
    properties:
      request_id: { type: string }
      status: { type: string, enum: [SUCCEEDED] }
      replay: { type: boolean }
      effect_id: { type: string, format: uuid }
      received_micros: { type: integer, format: int64 }
      available_micros: { type: integer, format: int64 }
  ProductionReleaseRequest:
    type: object
    additionalProperties: false
    required: [request_id]
    properties:
      request_id: { type: string }
  ProductionReleaseResponse:
    type: object
    additionalProperties: false
    required: [request_id, status, replay, effect_id, available_micros, available_micros_exact, quantity_scale]
    properties:
      request_id: { type: string }
      status: { type: string, enum: [SUCCEEDED] }
      replay: { type: boolean }
      effect_id: { type: string, format: uuid }
      available_micros: { type: integer, format: int64 }
      available_micros_exact: { type: string, pattern: '^[0-9]+$', description: "Original committed work-order available total in millionths; use this string for exact values" }
      quantity_scale: { type: integer, enum: [1000000] }
  SemiReissueRequest:
    type: object
    additionalProperties: false
