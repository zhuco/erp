  MaterialDocumentRejectedBeforeCommit:
    type: object
    additionalProperties: false
    required: [code, committed, request_id, fields, context, message]
    description: A new business command reached a definite rejection before COMMIT. This declares only that this request did not commit; it is not a successful save, source adoption or posting result. Available only when rejection_envelope=true. Clients must durably acknowledge the exact pending command before accepting edits and allocating a fresh request ID. No SQL/COMMIT uncertainty, authorization denial or original-command conflict receives this declaration.
    properties:
      code: { type: string, enum: [material_document_rejected_before_commit] }
      committed: { type: boolean, enum: [false] }
      request_id: { type: string, minLength: 1, maxLength: 128 }
      fields:
        type: object
        additionalProperties: true
        description: The exact decoded save, confirm or source-adoption DTO, including the business value being rejected. It is echoed for pending-command comparison and need not satisfy successful-command business constraints. Omitted optional draft-line fields are explicit nulls. Clients must compare the complete DTO with the frozen request; an object shape alone is not rejection proof.
      context:
        type: object
        additionalProperties: false
        required: [tenant_id, actor_user_id, work_order_id, document_id]
        properties:
          tenant_id: { type: string, format: uuid }
          actor_user_id: { type: string, format: uuid }
          work_order_id: { type: string, format: uuid }
          document_id: { type: string, format: uuid }
      message: { type: string }

  MaterialBatchOption:
    type: object
    additionalProperties: false
    required: [batch_id, batch_no, expire_at, on_hand_micros, reserved_micros, available_micros, state]
    properties:
      batch_id: { type: string, format: uuid }
      batch_no: { type: string, nullable: true }
      expire_at: { type: string, format: date-time, nullable: true }
      on_hand_micros: { type: string, nullable: true, description: Actual exact stored value; NULL is unknown and not converted from legacy quantity. }
      reserved_micros: { type: string, nullable: true }
      available_micros: { type: string, nullable: true, description: Lesser of exact batch free stock and actual warehouse availability; NULL when complete context requires reconciliation. Expiry is separately represented by state. }
      state: { type: string, enum: [READY, EMPTY, EXPIRED, RECONCILIATION_REQUIRED] }
  MaterialBatchOptionsResponse:
