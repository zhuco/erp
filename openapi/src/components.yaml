    properties:
      request_id: { type: string }
      line_no: { type: integer, format: int32 }
      expected_version: { type: integer, format: int32 }
      qty_micros: { type: integer, format: int64 }
      action: { type: string, nullable: true, description: Existing delivery state-machine action; action branch requires delivery_id and the inventory key fields }
      delivery_id: { type: string, nullable: true }
      carrier_ref: { type: string, nullable: true }
      warehouse_id: { type: string, nullable: true }
      location_id: { type: string, nullable: true }
      sku_id: { type: string, nullable: true }
      batch_code: { type: string, nullable: true }
      delivery_request: { type: string, nullable: true, description: Original delivery planning request to look up }
      cancel_qty_micros: { type: integer, format: int64, nullable: true }
