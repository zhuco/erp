    description: Current shared sales-delivery handler input. The four required fields are required by Rust decoding for every branch. Positive cancel_qty_micros takes precedence, then a nonempty delivery_request lookup, then action, otherwise delivery planning. Quantities are signed micro-unit integers; one unit equals 1000000. This preserves the existing numeric HTTP contract.
