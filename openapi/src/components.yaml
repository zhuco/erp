          location_record: { $ref: "#/components/schemas/InventoryLocationEffect" }
          ledger_id: { type: string, format: uuid, description: "Compatibility projection ID; effect_id is the primary inventory ledger." }
          qty_micros: { type: integer, format: int64, deprecated: true, description: "Compatibility integer; exact original quantities are decimal text in record and location_record." }
