/v1/tenants/{tenant_id}/after-sale-cases:
  get:
    summary: List after-sale cases
    security:
      - bearerAuth: []
    x-permissions:
      - aftersales.read
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: { type: string }
      - name: shop_id
        in: query
        schema: { type: string }
      - name: platform
        in: query
        schema: { type: string }
      - name: case_status
        in: query
        schema: { type: string }
      - name: updated_from
        in: query
        schema: { type: string, format: date-time }
      - name: updated_to
        in: query
        schema: { type: string, format: date-time }
      - name: platform_order_id
        in: query
        schema: { type: string }
      - name: page_size
        in: query
        schema: { type: integer, format: int32, minimum: 1 }
      - name: page_token
        in: query
        schema: { type: string }
    responses:
      "200":
        description: list of after-sale cases
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: array
                  items:
                    $ref: "#/components/schemas/AfterSaleCaseSummary"
                next_page_token:
                  type: string
                  nullable: true
      "400":
        description: invalid request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "401":
        description: unauthorized
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
      "403":
        description: forbidden
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorResponse"
